<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — 小坂脩蔵</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
  :root{--bg:#F2F1EC; --fg:#1C1B19; --fg3:#8E8B84; --acc:#E84518}
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
       font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif; text-align:center; line-height:1.9}
  .mark{width:56px; height:56px; margin:0 auto 26px; display:block}
  h1{margin:0 0 10px; font-size:clamp(22px,4vw,34px); font-weight:700; letter-spacing:.04em}
  p{margin:0; font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em; color:var(--fg3)}
  a{display:inline-block; margin-top:34px; color:var(--fg); text-decoration:none; border:1px solid var(--fg);
    padding:12px 26px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; letter-spacing:.14em; transition:background .3s, color .3s}
  a:hover{background:var(--acc); border-color:var(--acc); color:#FBF7F2}
  small{display:block; margin-top:40px; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.18em; color:var(--fg3)}
</style>
</head>
<body>
<main>
  <img class="mark" src="assets/favicon-192.png" alt="小">
  <h1>そのページは、見つかりませんでした。</h1>
  <p>404 · NOT FOUND — このお酒は置いていないようです。</p>
  <a href="./">カウンターへ戻る →</a>
  <small>KOSAKA SHUZO — JIBUN no ZENBU wo</small>
</main>
</body>
</html>
